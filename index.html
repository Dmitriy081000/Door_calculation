<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Двері — калькулятор і рахунки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEDE6; --paper:#FBFAF7; --ink:#2A2723; --ink-soft:#6B6559; --line:#DAD4C6;
    --graphite:#232220; --copper:#A6552E; --copper-dark:#8A4526; --brass:#B8935A;
    --sage:#5C7A5E; --sage-bg:#E7EEE6; --red:#A3402F; --red-bg:#F3E4DE; --radius:3px;
    --shadow:0 1px 2px rgba(35,34,32,.06),0 1px 1px rgba(35,34,32,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
  h1,h2,h3{font-family:'Zilla Slab',serif; margin:0; color:var(--graphite); letter-spacing:.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .topbar{background:var(--graphite); color:#F2EFE8; padding:14px 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .topbar svg{flex-shrink:0;}
  .topbar .titles{flex:1; min-width:0;}
  .topbar h1{color:#F2EFE8; font-size:19px; line-height:1.15;}
  .topbar .sub{font-size:11px; color:#BDB6A6; margin-top:2px; letter-spacing:.04em; text-transform:uppercase;}

  .tabs{display:flex; gap:2px; background:var(--graphite); padding:0 12px 10px; overflow-x:auto; position:sticky; top:64px; z-index:19; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0; padding:8px 14px; background:transparent; border:none; border-radius:999px; color:#C9C2B2; font-size:13px; font-weight:600; white-space:nowrap; transition:background .15s,color .15s;}
  .tab.active{background:var(--copper); color:#fff;}

  main{max-width:1040px; margin:0 auto; padding:20px 16px 80px;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:var(--shadow);}
  .card-title{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--copper-dark); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .card-title::after{content:""; flex:1; height:1px; background:var(--line);}

  .field{margin-bottom:8px;}
  .field label{display:block; font-size:14px; font-weight:700; color:var(--ink); margin-bottom:5px;}
  .field .fhint{font-size:11px; color:var(--ink-soft); font-weight:400; margin-top:4px; line-height:1.5;}
  .field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; font-size:14.5px; color:var(--ink);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brass); outline-offset:0; border-color:var(--brass);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .row4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;} .row3{grid-template-columns:1fr;} .row4{grid-template-columns:1fr 1fr;}}

  .seg{display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .seg button{flex:1; padding:9px 8px; background:#fff; border:none; border-right:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-soft);}
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--copper); color:#fff;}
  .seg button:disabled{opacity:.35; cursor:not-allowed;}
  .seg-vertical{flex-direction:column;}
  .seg-vertical button{border-right:none; border-bottom:1px solid var(--line); text-align:left;}
  .seg-vertical button:last-child{border-bottom:none;}
  .seg-sm button{padding:5px 8px; font-size:11.5px;}

  .model-card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; margin-bottom:6px;}
  .model-card-grid-single{grid-template-columns:1fr; justify-items:center;}
  .model-card{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:8px;
    cursor:pointer; text-align:center; transition:border-color .15s, transform .15s, box-shadow .15s;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .model-card img{max-height:110px; max-width:100%; display:block;}
  .model-card.selected{
    cursor:pointer; border-color:var(--copper); box-shadow:0 2px 10px rgba(35,34,32,.12); padding:16px; max-width:260px;
  }
  .model-card.selected img{max-height:380px;}

  .trim-layout{display:flex; gap:20px; align-items:flex-start;}
  .trim-controls{flex:0 0 auto; width:200px;}
  .trim-images{flex:1; min-width:0;}
  @media(max-width:640px){
    .trim-layout{flex-direction:column;}
    .trim-controls{width:100%;}
  }

  .btn{padding:10px 16px; border-radius:var(--radius); border:1px solid transparent; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .btn-primary{background:var(--copper); color:#fff;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .price-preview{background:var(--graphite); color:#F2EFE8; border-radius:var(--radius); padding:14px 16px; display:flex; justify-content:space-between; align-items:baseline; margin:14px 0;}
  .price-preview .label{font-size:12px; color:#BDB6A6; text-transform:uppercase; letter-spacing:.06em;}
  .price-preview .amount{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; color:var(--brass);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; padding:6px 8px; border-bottom:2px solid var(--line); white-space:nowrap;}
  td{padding:8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  main table:not(.spec-table) tr:last-child td{border-bottom:none;}
  td input, td select{padding:6px 8px; font-size:13px; border:1px solid var(--line); border-radius:var(--radius); width:100%; background:#fff;}
  .num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .tcenter{text-align:center;}

  .empty{text-align:center; padding:36px 16px; color:var(--ink-soft);}
  .empty p{font-size:14px; margin:4px 0;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .catalog-block{margin-bottom:26px;}
  .catalog-block h3{font-size:15px; margin-bottom:4px;}
  .catalog-block .desc{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}
  .badge{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;}
  .badge-hidden{background:var(--sage-bg); color:var(--sage);}
  .badge-trim{background:#EFE4D3; color:var(--brass);}

  .notice{background:var(--red-bg); border:1px solid var(--red); color:var(--red); padding:10px 12px; border-radius:var(--radius); font-size:12.5px; margin:10px 0; line-height:1.55;}
  .notice-soft{background:#EFE4D3; color:#7A5A2E; border:1px solid var(--brass); padding:9px 11px; border-radius:var(--radius); font-size:12px; margin:10px 0; line-height:1.5;}
  .notice-info{background:var(--sage-bg); color:var(--sage); border:1px solid var(--sage); padding:9px 11px; border-radius:var(--radius); font-size:12px; margin:10px 0; line-height:1.5;}

  .chk-list{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-bottom:6px;}
  @media(max-width:560px){.chk-list{grid-template-columns:1fr;}}
  .chk-row{display:flex; align-items:flex-start; gap:8px; font-size:13.5px;}
  .chk-row input[type=checkbox]{margin-top:3px; width:auto;}
  .chk-row input[type=text]{width:70px; padding:4px 6px; font-size:12.5px;}

  .total-row td{font-weight:700; font-size:15px; border-top:2px solid var(--graphite); border-bottom:none;}
  .total-row .num{font-family:'IBM Plex Mono',monospace; color:var(--copper-dark);}

  .invoice-list-item{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; background:#fff; cursor:pointer; transition:border-color .15s;}
  .invoice-list-item .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .invoice-list-item .sum{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--copper-dark);}

  .invoice-sheet{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow);}
  .invoice-head{display:flex; justify-content:space-between; gap:20px; border-bottom:2px solid var(--graphite); padding-bottom:16px; margin-bottom:18px;}
  .invoice-head h2{font-size:22px;}
  .invoice-head .company{white-space:pre-line; font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .invoice-head .num-date{text-align:right; font-size:13px;}
  .invoice-head .num-date .mono{font-size:16px; font-weight:600;}
  .invoice-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; font-size:13.5px;}
  .invoice-meta div span{display:block; font-size:11px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; margin-bottom:2px;}
  .invoice-table th{background:#F3F1EA;}
  .details-cell{font-size:11.5px; color:var(--ink-soft); line-height:1.6;}
  .invoice-footer{margin-top:22px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft);}

  .icon-btn{background:transparent; border:1px solid var(--line); border-radius:var(--radius); padding:6px 9px; color:var(--ink-soft); font-size:12px;}

  .series-card{border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:16px; background:#fff;}
  .series-card .stop-row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .series-card .sname{font-size:15px; font-weight:600; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); flex:1; min-width:200px;}
  .series-card .skind{padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); font-size:13px;}
  .tier-chip{display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:4px 8px 4px 10px; font-size:12px; margin:0 6px 6px 0;}
  .tier-chip input{width:60px; padding:3px 5px; font-size:11.5px; border:1px solid var(--line); border-radius:3px;}
  .tier-chip input[data-tier-field="label"]{width:210px;}
  .cellgroup{display:flex; gap:3px; align-items:center;}
  .cellgroup input{width:56px;}
  .cellgroup select{width:60px; padding:6px 2px;}
  .ws-box{background:var(--bg); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:12px; font-size:12.5px;}
  .ws-box label{display:inline-flex; align-items:center; gap:5px; margin-right:10px;}
  .ws-box input[type=number]{width:60px; padding:4px 6px; font-size:12px;}

  /* ===== Specification ===== */
  .spec-sheet{background:#fff; border:1px solid var(--line); padding:14px; margin-bottom:22px; color:#000; font-weight:700; overflow-x:auto;}
  .spec-head{border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:8px; min-width:1100px;}
  .spec-headinfo{width:100%; border-collapse:collapse; font-size:12px;}
  .spec-headinfo td{padding:2px 6px; vertical-align:top; border:none;}
  .spec-page{position:relative; min-width:1100px;}
  .spec-table{width:100%; min-width:1100px; border-collapse:collapse; font-size:10px; table-layout:fixed; border-bottom:1.5px solid #000;}
  .spec-table th, .spec-table td{border:1px solid #000; padding:3px 3px; text-align:center; color:#000; overflow:hidden;}
  .spec-table th{font-size:6.5px; font-weight:700; background:#fff; line-height:1.2;}
  .spec-table td textarea{
    width:100%; max-width:100%; border:none; background:transparent; text-align:center; font-size:10px; color:#000; padding:1px;
    white-space:normal; overflow-wrap:break-word; word-break:break-word; box-sizing:border-box; resize:none; overflow:hidden;
    font-family:inherit; font-weight:700; display:block; line-height:1.25; vertical-align:middle;
  }
  .spec-table td textarea:focus{outline:1px solid var(--brass); background:#FFF8EC;}
  .spec-table td select.screen-only{width:100%; border:none; background:transparent; text-align:center; font-size:10px; color:#000; font-weight:700;}
  .spec-print-val{display:none; font-size:10px;}
  .spec-diagram{display:flex; justify-content:flex-end; margin-top:10px;}
  .spec-col-numL{width:3%;} .spec-col-name{width:8%;} .spec-col-bh{width:4.7%;} .spec-col-bw{width:4%;}
  .spec-col-ph{width:4.7%;} .spec-col-pw{width:4%;} .spec-col-finish{width:12%;} .spec-col-pcolor{width:6%;}
  .spec-col-opening{width:6%;} .spec-col-hinge{width:6%;} .spec-col-hqty{width:3%;} .spec-col-box{width:8.5%;}
  .spec-col-handle{width:4%;} .spec-col-wc{width:4%;} .spec-col-lock{width:7%;} .spec-col-lcolor{width:5%;}
  .spec-col-scolor{width:5%;} .spec-col-hcolor{width:5%;} .spec-col-num{width:1.5%;}
  .spec-col-dobirnaplanka{width:5.5%;} .spec-col-lyshtva{width:4%;} .spec-col-decor{width:9%;}

  @media print{
    .topbar,.tabs,.no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%; padding:0;}
    .invoice-sheet{border:none; box-shadow:none; padding:0;}
    .spec-table select.screen-only{display:none;}
    .spec-print-val{display:block;}
    .spec-sheet{
      border:none; box-shadow:none; margin:0; padding:8mm;
      width:297mm; height:210mm; box-sizing:border-box; overflow:visible;
      page-break-after:always; break-after:page;
    }
    .spec-sheet:last-child{page-break-after:auto;}
    .spec-head, .spec-page, .spec-table{min-width:0;}
    @page{ size:A4 landscape; margin:0; }
  }

  /* Hover effects only for devices that truly support hover (mouse) — avoids the classic
     iOS/Android "needs two taps" quirk when :hover is defined on a touch device. */
  @media (hover:hover) and (pointer:fine){
  .tab:not(.active):hover{background:#3A3834; color:#F2EFE8;}
  .model-card:hover{border-color:var(--copper);}
  .btn-primary:hover{background:var(--copper-dark);}
  .btn-ghost:hover{border-color:var(--copper); color:var(--copper-dark);}
  .invoice-list-item:hover{border-color:var(--copper);}
  .icon-btn:hover{color:var(--red); border-color:var(--red);}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>

  <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
    <rect x="7" y="3" width="16" height="24" rx="1" stroke="#B8935A" stroke-width="1.6"/>
    <circle cx="19.5" cy="15" r="1.3" fill="#B8935A"/>
    <line x1="7" y1="3" x2="7" y2="27" stroke="#A6552E" stroke-width="1.6"/>
  </svg>
  <div class="titles">
    <h1 id="companyHeaderName">Двері — калькулятор</h1>
    <div class="sub">Прихований монтаж · Зі лиштвою</div>

</div>

<div class="tabs" id="tabs">
  <button class="tab" data-tab="calcHidden">Прихований монтаж</button>

  <button class="tab" data-tab="object">Поточний об'єкт</button>

  <button class="tab" data-tab="prices">Прайс-лист</button>
  <button class="tab" data-tab="company">Реквізити</button>
</div>

try{
  firebase.initializeApp(firebaseConfig);
  _fsDb = firebase.firestore();
}catch(e){ console.error('Firebase init failed, falling back to localStorage only', e); }

async function storeGet(key, fallback){
  if(_fsDb){
    try{
      const doc = await _fsDb.collection('doorsCalc').doc(key).get();
      if(doc.exists){
        const data = doc.data();
        if(data && 'value' in data){
          const parsed = JSON.parse(data.value);
          try{ localStorage.setItem('doorsCalc:'+key, data.value); }catch(e){} // локальний кеш про запас
          return parsed;
        }
      }
    }catch(e){ console.error('Firestore get failed, using local cache', key, e); }
  }
  try{ const v = localStorage.getItem('doorsCalc:'+key); if(v==null) return fallback; return JSON.parse(v); }
  catch(e){ return fallback; }
}
async function storeSet(key, value){
  const json = JSON.stringify(value);
  try{ localStorage.setItem('doorsCalc:'+key, json); } catch(e){ console.error('local cache set failed', key, e); }
  if(_fsDb){
    try{ await _fsDb.collection('doorsCalc').doc(key).set({value: json}); }
    catch(e){ console.error('Firestore set failed (saved locally only)', key, e); }
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function roundTo5(v){ const n=parseFloat(v); if(!isFinite(n)) return null; return Math.round(n/5)*5; }
function widthSurchargeDisplayThreshold(base, steps){
  // Пороги для ТЕКСТУ примітки (не для самого розрахунку!). За документами доплата рахується
  // "понад 800мм" — а фактичний безкоштовний допуск до 815мм є лише внутрішньою технічною межею
  // розрахунку і в текст не потрапляє. Далі — рівними сотнями: 900 → 1000 → 1100.
  if(!steps || steps<=1) return 800;
  return 900 + (steps-2)*100;
}
let _suppressDimBlur = false; // true під час перемальовування, яке ми самі запустили через oninput — щоб не плутати це зі справжньою втратою фокусу користувачем
function getActiveCompany(){ return state.companies.find(c=>c.id===state.activeCompanyId) || state.companies[0] || {name:'',requisites:'',phone:'',address:''}; }
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function colorField(prefix, key, label, options, val, custom){
  const isCustom = val==='__custom__';
  return `<div class="field">
    <label>${label}</label>
    <select id="${prefix}_${key}">
      ${options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      <option value="__custom__" ${isCustom?'selected':''}>Свій варіант…</option>
    </select>
    ${isCustom ? `<input type="text" id="${prefix}_${key}Custom" value="${esc(custom||'')}" placeholder="Впишіть колір, напр. золото, темний асфальт" style="margin-top:6px;">` : ''}
  </div>`;
}
function colorValue(val, custom){ return val==='__custom__' ? (custom||'').trim() : val; }

   correcting the earlier photo). PLEASE VERIFY against originals.
============================================================ */
function mkRow(label, pairs){
  const cells = {};
  pairs.forEach(p=>{ cells[p[0]] = {price:p[1], hingeQty:p[2], hingeType:p[3]}; });
  return {id:uid(), finishLabel:label, cells};
}
function mkRowS(label, schemeKey, group, pairs){
  const r = mkRow(label, pairs);
  r.schemeKey = schemeKey;
  r.modelGroup = group;
  return r;
}
function cloneSeriesData(hiddenSeries){
  const idMap = {};
  const tiers = hiddenSeries.tiers.map(t=>{ const nt = {...t, id:uid()}; idMap[t.id]=nt.id; return nt; });
  const rows = hiddenSeries.rows.map(r=>{
    const cells = {};
    Object.entries(r.cells).forEach(([tid,cell])=>{ cells[idMap[tid]] = {...cell}; });
    return {id:uid(), finishLabel:r.finishLabel, cells};
  });
  return {tiers, rows};
}

async function loadAll(){
  const storedSeries = await storeGet(KEYS.series, null);
  const hasStoredSeries = Array.isArray(storedSeries) && storedSeries.length>0;
  state.series = hasStoredSeries ? storedSeries : buildSeed();
  if(hasStoredSeries){
    // Migration: bring in trim series added after this data was first saved, without touching
    // anything the user already edited (renames, price corrections, new series they added, etc.)
    const renameMap = {'40мм':'WOOD 40', '50мм':'WOOD 50'};
    state.series.forEach(s=>{ if(renameMap[s.name]) s.name = renameMap[s.name]; });
    const existingTrimNames = new Set(state.series.filter(s=>s.kind==='trim').map(s=>s.name));
    const freshTrim = buildSeed().filter(s=>s.kind==='trim');
    let migrated = false;
    freshTrim.forEach(s=>{ if(!existingTrimNames.has(s.name)){ state.series.push(s); migrated = true; } });
    // Alum trim series used to clone the hidden-mount price table (grunt/mirror/glass with real hinges) —
    // now they should be WOOD price + a flat aluminium-frame addon. Replace any old-style Alum series in place.
    freshTrim.filter(s=>/^alum/i.test(s.name)).forEach(freshS=>{
      const idx = state.series.findIndex(s=>s.kind==='trim' && s.name===freshS.name);
      if(idx>=0 && !state.series[idx].alumFrameAddon){ state.series[idx] = freshS; migrated = true; }
    });
    // old temporary hinge code 'WD' -> 'HF' (Хафеле)
    state.series.forEach(s=>{ s.rows.forEach(r=>{ Object.values(r.cells).forEach(c=>{ if(c.hingeType==='WD'){ c.hingeType='HF'; migrated=true; } }); }); });
    if(migrated) await storeSet(KEYS.series, state.series);
  }
  state.hingeRef    = await storeGet(KEYS.hingeRef, null)    ?? SEED_HINGE_REF;
  if(!state.hingeRef.find(h=>h.code==='HF')){
    state.hingeRef.push({id:uid(), code:'HF', name:'Хафеле', maxWeightPair:0});
    await storeSet(KEYS.hingeRef, state.hingeRef);
  }
  state.hiddenExtras= await storeGet(KEYS.hiddenExtras, null)?? SEED_HIDDEN_EXTRAS;
  state.trimExtras  = await storeGet(KEYS.trimExtras, null)  ?? SEED_TRIM_EXTRAS;
  const storedCompanies = await storeGet(KEYS.companies, null);
  if(Array.isArray(storedCompanies) && storedCompanies.length>0){
    state.companies = storedCompanies;
  } else {
    // Міграція зі старого одинарного формату реквізитів, якщо він є
    const oldCompany = await storeGet(KEYS.company, null);
    state.companies = [oldCompany && (oldCompany.name||oldCompany.requisites||oldCompany.phone||oldCompany.address)
      ? {id:uid(), ...oldCompany}
      : {id:uid(), name:'', requisites:'', phone:'', address:''}];
    await storeSet(KEYS.companies, state.companies);
  }
  state.activeCompanyId = (await storeGet(KEYS.activeCompanyId, null)) || state.companies[0].id;
  if(!state.companies.find(c=>c.id===state.activeCompanyId)) state.activeCompanyId = state.companies[0].id;
  state.boxSpec     = await storeGet('doors:boxSpec', null)  ?? state.boxSpec;
  state.currentObject = await storeGet(KEYS.currentObject, null) ?? state.currentObject;
  state.invoices    = await storeGet(KEYS.invoices, null)    ?? [];
  state.specifications = await storeGet(KEYS.specs, null)    ?? [];

  initCalcForm(state.hf, 'hidden');
  initCalcForm(state.tf, 'trim');
}
function initCalcForm(f, kind){
  if(!f.seriesId && kind==='hidden'){
    const pool = state.series.filter(s=>s.kind===kind);
    if(pool.length){ f.seriesId = pool[0].id; f.rowId = pool[0].rows.length ? pool[0].rows[0].id : ''; }
  }
  if(kind==='hidden'){
    const s = state.series.find(x=>x.id===f.seriesId);
    if(s && !f.opening){ f.opening = s.allowNormalOpening ? 'normal' : 'inside'; }
  }
  // trim: seriesId/opening intentionally left unset here — the person must pick an opening
  // direction first, which then filters which collections (Коллекция) are selectable.
}

function hingeName(code){
  const h = state.hingeRef.find(x=>x.code===code);
  return h ? h.name+(h.maxWeightPair?' (до '+h.maxWeightPair+'кг/пара)':'') : (code||'—');
}
function effectiveMaxWidth(series, tier){
  if(series.widthSurcharge && series.widthSurcharge.enabled) return series.widthSurcharge.maxWidth;
  return tier.maxWidth;
}
function pickTierForRow(series, row, w, h){
  const fit = series.tiers.filter(t=> w<=effectiveMaxWidth(series,t) && h<=t.maxHeight && row.cells[t.id]);
  if(!fit.length) return null;
  fit.sort((a,b)=> (a.maxWidth*a.maxHeight)-(b.maxWidth*b.maxHeight));
  return fit[0];
}

  if(tier){
    const cell = row.cells[tier.id] || {price:0, hingeQty:0, hingeType:''};
    basePrice = cell.price; hingeQtyDefault = cell.hingeQty; hingeTypeDefault = cell.hingeType;
  } else {
    oversize = true;
    basePrice = parseFloat(f.manualPrice)||0;

  const hingeType = f.hingeType || hingeTypeDefault;
  const hingeQty = (f.hingeQty!=='' && f.hingeQty!=null) ? (parseInt(f.hingeQty)||0) : hingeQtyDefault;

  // Aluminium-frame addon for trim doors (Alum collections): flat surcharge on top of the base WOOD-model price
  let alumFrameAmount = 0;
  if(!oversize && tier && series.alumFrameAddon && series.alumFrameAddon[tier.id]!=null){
    alumFrameAmount = series.alumFrameAddon[tier.id];
  }

  // Width-over-base surcharge — накопичувально (відсоток на відсоток): кожні наступні ws.step мм
  // додають ще ws.percent% вже до ціни з попередньою надбавкою, а не до початкової базової ціни.
  let extraWidthPercent = 0, widthSurchargeAmount = 0, widthSurchargeSteps = 0;
  const ws = series.widthSurcharge;
  if(!oversize && ws && ws.enabled && w>ws.baseWidth){
    const cappedW = Math.min(w, ws.maxWidth);
    const steps = Math.ceil((cappedW-ws.baseWidth)/ws.step);
    widthSurchargeSteps = steps;
    const multiplier = Math.pow(1+ws.percent/100, steps);
    extraWidthPercent = (multiplier-1)*100; // ефективний сумарний % — для показу в деталях/специфікації
    widthSurchargeAmount = basePrice*(multiplier-1);
  }

  // Inside-opening addon (trim doors: flat surcharge, profile goes from 40mm to 50mm)
  let openingAddon = 0;
  if(kind==='trim' && series.insideOpeningAddon!=null && f.opening==='inside'){
    openingAddon = series.insideOpeningAddon;
  }

  // Добірна планка: перший 100мм — безкоштовно, кожні наступні (неповні) 100мм — +17€/тир.
  // Рахується автоматично від фактичної глибини (f.trimPlankWidth), без ручного вибору опції.
  let dobirnaPlankaAmount = 0, dobirnaPlankaThreshold = 0;
  if(kind==='trim'){
    const dp = parseFloat(f.trimPlankWidth)||0;
    if(dp>100){
      const tiers = Math.min(3, Math.ceil((dp-100)/100));
      dobirnaPlankaAmount = tiers*17;
      dobirnaPlankaThreshold = 100 + tiers*100;
    }
  }

  const extrasCatalog = kind==='hidden' ? state.hiddenExtras : state.trimExtras;
  const extras = [];

    if(e.unit==='perUnit'){

    lines.push('Відкривання: '+(f.opening==='inside'?'інсайд':'звичайне')+', сторона: '+(f.openingSide==='right'?'праве':'ліве'));

    lines.push('Замок: '+f.lockType+(f.lockType==='Замок замовника' && f.lockCustomText ? ' — '+f.lockCustomText+' (без гарантії)' : '')+', колір: '+colorValue(f.lockColor,f.lockColorCustom));
    lines.push('Колір ущільнювача: '+colorValue(f.sealColor,f.sealColorCustom));
    lines.push('Ручка: '+f.handleModel+', колір '+colorValue(f.handleColor,f.handleColorCustom));
  }
  if(kind==='trim' && calc.series.insideOpeningAddon!=null){
    const modelCatalog = getTrimModelCatalog();
    const pickedModel = modelCatalog.find(r=>r.id===f.trimModelImageId);
    if(pickedModel) lines.push('Дизайн полотна: '+pickedModel.finishLabel);
    lines.push('Відкривання: '+(f.opening==='inside'?'інсайд':'звичайне')+', сторона: '+(f.openingSide==='right'?'права':'ліва')+' (колекція '+calc.series.name+')'+(calc.openingAddon>0?' (+'+money(calc.openingAddon)+' '+CUR+')':''));
    if(f.openingDepth) lines.push('Глибина отвору: '+f.openingDepth+'мм, добірна планка: '+(f.trimPlankWidth||'—'));
    if(calc.dobirnaPlankaAmount>0) lines.push('Опція: добірна планка до '+calc.dobirnaPlankaThreshold+'мм +'+money(calc.dobirnaPlankaAmount)+' '+CUR);
    lines.push('Лиштва: '+(f.lyshtvaSets||'2')+' компл.');
    if(calc.alumFrameAmount>0) lines.push('Надбавка за алюмінієвий каркас: +'+money(calc.alumFrameAmount)+' '+CUR);
    if(f.doorColorRal) lines.push('Колір дверей: '+f.doorColorRal);
    if(calc.row && calc.row.modelGroup==='a' && f.alumInsert==='так') lines.push('Алюмінієва вставка (молдинг): так, колір — '+colorValue(f.insertColor,f.insertColorCustom));
    if(calc.row && calc.row.modelGroup==='a' && f.glassInsertA==='так') lines.push('Скляна вставка: так, колір — '+colorValue(f.glassColor,f.glassColorCustom));
    if(calc.row && calc.row.modelGroup==='b') lines.push('Колір скла: '+colorValue(f.glassColor,f.glassColorCustom));
    lines.push('Колір ущільнювача: '+colorValue(f.sealColor,f.sealColorCustom));
    lines.push('Колір замку: '+colorValue(f.lockColor,f.lockColorCustom));
    lines.push('Колір завіс: '+colorValue(f.hingeColor,f.hingeColorCustom));
    lines.push('Колір ручки: '+colorValue(f.handleColor,f.handleColorCustom));
    if(calc.series && /^alum/i.test(calc.series.name)) lines.push('Колір профілю: '+colorValue(f.profileColor,f.profileColorCustom));
  }
  if(calc.widthSurchargeAmount>0) lines.push('Надбавка за ширину понад '+widthSurchargeDisplayThreshold(calc.series.widthSurcharge.baseWidth, calc.widthSurchargeSteps)+'мм: +'+(Math.round(calc.extraWidthPercent*100)/100)+'% ('+money(calc.widthSurchargeAmount)+' '+CUR+')');
  calc.extras.forEach(e=> lines.push(e.name+(e.qty?' × '+e.qty:'')+' (+'+money(e.computed)+' '+CUR+')'));
  return lines;
}

/* ============================================================
   RENDER
============================================================ */
const app = document.getElementById('app');
function render(){
  const ae = document.activeElement;
  const restoreId = (ae && app.contains(ae) && ae.id) ? ae.id : null;
  const restoreSel = (restoreId && typeof ae.selectionStart === 'number') ? [ae.selectionStart, ae.selectionEnd] : null;
  const scrollY = window.scrollY;

  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));
  document.getElementById('companyHeaderName').textContent = getActiveCompany().name || 'Двері — калькулятор';
  if(state.tab==='calcHidden') app.innerHTML = renderCalcGeneric('hidden');
  else if(state.tab==='calcTrim') app.innerHTML = renderCalcGeneric('trim');
  else if(state.tab==='object') app.innerHTML = renderObject();
  else if(state.tab==='prices') app.innerHTML = renderPrices();
  else if(state.tab==='company') app.innerHTML = renderCompany();
  else if(state.tab==='invoices') app.innerHTML = state.viewInvoiceId ? renderInvoiceView(state.viewInvoiceId) : renderInvoicesList();
  else if(state.tab==='specs') app.innerHTML = state.viewSpecId ? renderSpecView(state.viewSpecId) : renderSpecsList();
  attachHandlers();

  if(restoreId){
    const el = document.getElementById(restoreId);
    if(el){ el.focus({preventScroll:true}); if(restoreSel && el.setSelectionRange){ try{ el.setSelectionRange(restoreSel[0], restoreSel[1]); }catch(e){} } }
  }
  window.scrollTo(0, scrollY);
}

function renderCalcGeneric(kind){
  const prefix = kind==='hidden' ? 'h' : 't';
  const f = kind==='hidden' ? state.hf : state.tf;
  const pool = state.series.filter(s=>s.kind===kind);
  if(!pool.length){
    return `<div class="card empty"><p><strong>Нет ни одной серии.</strong></p><p>Додайте серію у вкладці «Прайс-лист».</p></div>`;
  }
  let series, trimPool;
  if(kind==='trim'){
    trimPool = f.opening ? pool.filter(s=> f.opening==='inside' ? s.allowInsideOpening : s.allowNormalOpening) : [];
    if(!trimPool.find(s=>s.id===f.seriesId)){ f.seriesId = trimPool.length ? trimPool[0].id : ''; f.rowId=''; }
    series = trimPool.find(s=>s.id===f.seriesId);
  } else {
    if(!pool.find(s=>s.id===f.seriesId)){ f.seriesId = pool[0].id; f.rowId = pool[0].rows.length?pool[0].rows[0].id:''; }
    series = pool.find(s=>s.id===f.seriesId);
  }
  const rows = series ? series.rows : [];
  const isAlumTrim = kind==='trim' && series && /^alum/i.test(series.name);
  const selectedTrimModel = kind==='trim' ? getTrimModelCatalog().find(r=>r.id===f.trimModelImageId) : null;
  const selectedTrimGroup = selectedTrimModel ? selectedTrimModel.modelGroup : '';

    // keep the chosen WOOD panel design in sync across any trim collection (WOOD or Alum, 40 or 50/55) —
    // it's the same panel design, just on a different frame/thickness, matched by its stable schemeKey.
    const catalogRow = getTrimModelCatalog().find(r=>r.id===f.trimModelImageId);
    const matched = catalogRow && rows.find(r=>r.schemeKey===catalogRow.schemeKey);
    if(matched) f.rowId = matched.id;
  }
  const calc = computeSeriesCalc(f, kind);
  const extrasCatalog = kind==='hidden' ? state.hiddenExtras : state.trimExtras;
  const seriesLabel = kind==='hidden' ? 'Профіль' : 'Колекція';
  const rowLabel = kind==='hidden' ? 'Оздоблення (комбінація сторін)' : 'Модель';
  const showHinges = calc && !calc.incomplete && (calc.hingeTypeDefault || calc.hingeType);

  return `
  <div class="card">
    <div class="card-title">${kind==='hidden'?'Прихований монтаж':'Зі лиштвою'} — розрахунок</div>

    ${kind==='trim' ? `

      <div class="trim-controls">

            <button type="button" data-opening="inside" class="${f.opening==='inside'?'active':''}">Інсайд</button>
          </div>
        </div>
        <div class="field">
          <label>Сторона відкривання</label>
          <div class="seg seg-vertical seg-sm">
            <button type="button" data-tside="left" class="${f.openingSide!=='right'?'active':''}">Ліве</button>
            <button type="button" data-tside="right" class="${f.openingSide==='right'?'active':''}">Праве</button>
          </div>
        </div>
        <div class="field">
          <label>${seriesLabel}</label>
          <select id="${prefix}_series" ${!f.opening?'disabled':''}>
            ${!f.opening ? '<option value="">Спочатку оберіть відкривання</option>' : trimPool.map(s=>`<option value="${s.id}" ${s.id===f.seriesId?'selected':''}>${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        ${series ? (()=>{
          const catalog = getTrimModelCatalog();
          if(!catalog.length) return '';
          const groups = [['a','Модель 01-011'],['b','Модель 11-18'],['other','Інше']];

        ${series.note ? `<div class="fhint">${esc(series.note)}</div>` : ''}
      </div>
      ${rows.length ? `
      <div class="field">
        <label>${rowLabel}</label>
        <select id="${prefix}_row">${rows.map(r=>`<option value="${r.id}" ${r.id===f.rowId?'selected':''}>${esc(r.finishLabel)}</option>`).join('')}</select>
      </div>` : `<div class="notice">У цій серії поки немає жодного рядка — додайте їх у «Прайс-лист».</div>`}

    ${kind==='hidden' && rows.length ? (()=>{

      if(!f.faceFinish && !f.backFinish){ const [d1,d2] = computeDefaultFinishSides(curRow, ''); f.faceFinish=d1; f.backFinish=asym?d2:d1; }

      if(!asym){
        return `
        <div class="field">
          <label>Оздоблення (обидві сторони)</label>
          <input type="text" id="${prefix}_facefinish" value="${esc(f.faceFinish)}" placeholder="напр. RAL 9010">
        </div>
        <div class="fhint" style="margin:-8px 0 12px; font-size:9.5px;">На цьому профілі відсутня можливість різного оздоблення з двох сторін — обидві сторони завжди однакові.</div>`;
      }
      return `
      <div class="field">
        <label>Оздоблення — лицьова сторона</label>

    <div class="row4">

    ${extrasCatalog.length ? `

const SPEC_DOOR_FIELDS = ['name','blockSize','panelSize','finish','profileColor','opening','hinge','hingeQty','boxType','handle','wc','lockMech','lockColor','sealColor','hingeColor'];
const SPEC_PULLED_FIELDS = ['name','panelH','panelW','finish','profileColor','opening','hinge','hingeQty','boxType','lockMech','lockColor','sealColor','hingeColor'];
const BLOCK_EXTRA_H = 44, BLOCK_EXTRA_W = 67; // fixed difference between block (короб) and panel (полотно) size — hidden-mount doors
const TRIM_BLOCK_EXTRA_H = 46, TRIM_BLOCK_EXTRA_W = 72; // same idea for trim (с наличником) doors, used in the trim specification's block-size column

function blankDoorEntry(){
  return {id:uid(), type:'door', name:'', blockSize:'', panelSize:'', finish:'', profileColor:'', opening:'', hinge:'', hingeQty:'', boxType:'', handle:'Так', wc:'Ні', lockMech:'', lockColor:'', sealColor:'', hingeColor:''};
}
function blankAluCuttingDoorEntry(){
  return {id:uid(), type:'door', name:'', blockSize:'', panelSize:'', chetvVert:'', chetvHor:'', finish:'', profileColor:'', opening:'', hinge:'', hingeQty:'', boxType:'', handle:'Так', wc:'Ні', lockMech:'', lockColor:'', sealColor:'', hingeColor:''};
}
function buildAluCuttingSpecFromInvoice(invoice){
  const entries = [];
  let doorNum = 0;
  const noteGroups = {}; // текст опції (без ціни) → список номерів дверей, що її використовують
  const addOptionNote = (text)=>{
    if(!noteGroups[text]) noteGroups[text] = [];
    noteGroups[text].push(doorNum);
  };
  invoice.items.forEach(item=>{
    if(item.type!=='hidden') return; // ця специфікація стосується лише різальника алюмінієвого профілю скритого монтажу
    const qty = item.qty||1;
    for(let i=0;i<qty;i++){
      const e = blankAluCuttingDoorEntry();
      const sp = item.spec||{};
      e.name = (sp.profileName||item.title) + (sp.frameMatrix?' мат. '+sp.frameMatrix:'');
      e.panelSize = item.h+'×'+item.w;
      e.blockSize = (item.h+BLOCK_EXTRA_H)+'×'+(item.w+BLOCK_EXTRA_W);
      e.finish = (sp.faceFinish && sp.backFinish) ? (sp.faceFinish===sp.backFinish ? sp.faceFinish : sp.faceFinish+' / '+sp.backFinish) : (sp.finishLabel||'');
      e.profileColor = sp.profileColor||'';
      e.opening = sp.opening==='inside' ? ('Інсайд\n'+(sp.openingSide==='right'?'Праве':'Ліве')) : (sp.openingSide==='right'?'Праве':'Ліве');
      e.hinge = hingeNameShort(sp.hingeCode||'');
      e.hingeQty = sp.hingeQty;
      e.boxType = state.boxSpec.name + (state.boxSpec.matrix?' мат. '+state.boxSpec.matrix:'');
      e.handle = 'Так';
      e.wc = 'Ні';
      e.lockMech = sp.lockType + (sp.lockType==='Замок замовника' && sp.lockCustomText ? ' — '+sp.lockCustomText : '');
      e.lockColor = sp.lockColor;
      e.sealColor = sp.sealColor;
      e.hingeColor = sp.hingeColor;
      // Розрахунок: стойова — від висоти полотна, поперечна — від ширини полотна, надбавка на
      // поперечну залежить від кольору профілю (чорний/сірий — трохи різні через товщину плівки).
      const h = parseFloat(item.h)||0, w = parseFloat(item.w)||0;
      const isGrey = /сір/i.test(e.profileColor||'');
      e.chetvVert = h ? (h-12.5) : '';
      e.chetvHor = w ? (w-(isGrey?24.3:23.9)) : '';
      entries.push(e);
      doorNum++;
      if(sp.widthSurchargeAmount>0){
        addOptionNote('надбавка за ширину понад '+widthSurchargeDisplayThreshold(sp.widthSurchargeBase, sp.widthSurchargeSteps)+'мм');
      }
      if(sp.selectedExtras){
        sp.selectedExtras.forEach(ex=>{
          addOptionNote(ex.name+(ex.qty?' × '+ex.qty:''));
        });
      }
    }
  });
  Object.keys(noteGroups).forEach(text=>{
    entries.push({id:uid(), type:'note', text:'Позиція: '+noteGroups[text].join(',')+' - Опція: '+text});
  });
  entries.push({id:uid(), type:'note', text:'Шильда WD'});
  return entries;
}
function hingeNameShort(code){
  const h = state.hingeRef.find(x=>x.code===code);

}
function oneSideFinishTransform(p, doorColor){
  const norm = (p||'').toLowerCase();
  if(norm.includes('грунт')) return 'Грунт';
  if(norm.includes('фарба')) return 'RAL '+(doorColor||'____');
  return (p||'').replace(/\s*на дв[іi] сторони( полотна)?\s*$/i,'').trim();
}
function computeDefaultFinishSides(row, doorColor){
  if(!row) return ['',''];
  const parts = (row.finishLabel||'').split('/').map(p=>p.trim()).filter(Boolean);
  if(parts.length===2) return [oneSideFinishTransform(parts[0],doorColor), oneSideFinishTransform(parts[1],doorColor)];
  const v = oneSideFinishTransform(parts[0]||row.finishLabel||'', doorColor);
  return [v, v];
}
function buildSpecFromInvoice(invoice){

function buildCuttingSpecFromInvoice(invoice){
  const entries = [];
  invoice.items.forEach(item=>{
    if(item.type!=='trim') return; // специфікація для розкрійника стосується лише дверей з наличником
    const qty = item.qty||1;
    for(let i=0;i<qty;i++){
      const e = blankCuttingDoorEntry();
      const sp = item.spec||{};
      e.name = (sp.trimModelLabel || item.title) + (sp.modelName ? ' '+sp.modelName.replace(/^WOOD\s*/i,'')+(sp.frameMatrix?' мат. '+sp.frameMatrix:'') : '');
      e.lyshtvaQty = sp.lyshtvaSets || '2';
      e.finish = sp.doorColorRal || '';
      e.opening = sp.opening==='inside' ? ('Інсайд\n'+(sp.openingSide==='right'?'Права':'Ліва')) : (sp.openingSide==='right'?'Права':'Ліва');
      // Розрахунок розкрою: усі розміри — від реального розміру полотна (В×Ш), плюс фіксована
      // надбавка під кожен конкретний виріб. Формула відрізняється для звичайного відкривання
      // і для інсайду. Глибина добірної планки — не формула, а те саме значення, що й у
      // звичайній специфікації (ширина добірної планки).
      const h = parseFloat(item.h)||0, w = parseFloat(item.w)||0;
      const isInside = sp.opening==='inside';
      e.lfVert = h ? (h+(isInside?81:93)) : '';
      e.lfHor = w ? (w+(isInside?-18:6)) : '';
      e.lbVert = h ? (h+(isInside?100:96)) : '';
      e.lbHor = w ? (w+(isInside?18:12)) : '';
      e.dpVert = h ? (h+(isInside?20:16)) : '';
      e.dpHor = w ? (w+(isInside?50:44)) : '';
      e.dpDepth = sp.trimPlankWidth || '';
      e.korobVert = h ? (h+13) : '';
      e.korobHor = w ? (w+6) : '';
      entries.push(e);
    }
  });
  entries.push({id:uid(), type:'note', text:'Шильда WD'});
  return entries;
}

function assignSpecPages(entries){
  // Примітки завжди друкуються внизу, після всіх дверей — не там, де їх додали.
  const sorted = [...entries.filter(e=>e.type!=='note'), ...entries.filter(e=>e.type==='note')];
  const totalDoors = sorted.filter(e=>e.type==='door').length;
  const lastDoorsPage = Math.max(1, Math.ceil(totalDoors/10)); // де фактично закінчились двері — примітки йдуть саме сюди, не на новий лист
  let doorIdx = 0;
  return sorted.map(e=>{
    if(e.type==='note') return {...e, _page:lastDoorsPage};
    const page = Math.floor(doorIdx/10)+1;
    doorIdx++;
    return {...e, _page:page};
  });
}

      // з переліком номерів рядків, яких вона стосується.
      const schemeGroups = [];
      withScheme.forEach(e=>{

        if(!g){ g = {sig, schemeKey:e.woodSchemeKey, dims:e.woodSchemeDims, w:pw, h:ph, label:e.decor||e.name, nums:[]}; schemeGroups.push(g); }
        g.nums.push(e._num);
      });
      const schemeCards = schemeGroups.map(g=>`
        <div style="width:150px; text-align:center; margin-bottom:6px;">
          ${renderWoodSchemeSVG(g.schemeKey, g.dims||{}, g.w, g.h, true, true)}

        </div>`).join('');

        </div>
      </div>`;
    })()}
  </div>`;
}

function buildNumberedPages(entries){
  const withPages = assignSpecPages(entries);
  let counter=0;
  withPages.forEach(e=>{ counter++; e._num=counter; });
  const pages = {};
  withPages.forEach(e=>{ (pages[e._page]=pages[e._page]||[]).push(e); });
  return Object.keys(pages).map(Number).sort((a,b)=>a-b).map(pn=>pages[pn]);
}
function renderSpecView(id){
  const sp = state.specifications.find(x=>x.id===id);
  if(!sp) return renderSpecsList();

  const isMixed = sp.kind==='mixed';
  const hiddenPages = isMixed ? buildNumberedPages(sp.entries) : [];
  const trimPages = isMixed ? buildNumberedPages(sp.trimEntries||[]) : [];
  const sheetCount = isMixed ? Math.max(hiddenPages.length, trimPages.length, 1) : 0;

  const withPages = isMixed ? [] : assignSpecPages(sp.entries);
  let counter=0;
  withPages.forEach(e=>{ counter++; e._num=counter; });
  const pages = {};
  withPages.forEach(e=>{ (pages[e._page]=pages[e._page]||[]).push(e); });
  const pageNums = Object.keys(pages).map(Number).sort((a,b)=>a-b);

  const sheetsHtml = isMixed
    ? Array.from({length:sheetCount}, (_,idx)=>`
    <div class="spec-sheet">
      <div class="spec-head">
        <table class="spec-headinfo"><tr>
          <td><b>Замовлення</b><br><span class="mono" style="font-size:16px;">${esc(sp.number)}</span></td>
          <td><b>Дата</b><br>${esc(sp.date)}</td>
          <td style="width:40%; text-align:center; font-weight:700; font-size:14px;">Додаток ${idx+1}${sheetCount>1?' (стор. '+(idx+1)+' з '+sheetCount+')':''}</td>
          <td style="text-align:right;">Термін дії комерційної пропозиції ${esc(sp.offerValidDays)} дні</td>
        </tr></table>
        <div style="text-align:center; font-size:11px; margin-top:2px;">Термін ${esc(sp.productionDays)} днів</div>
      </div>
      ${hiddenPages[idx] ? renderSpecPageTable(sp, idx+1, hiddenPages[idx], true) : ''}
      ${trimPages[idx] ? `<div style="text-align:center; font-weight:700; font-size:13px; background:#eee; padding:3px 0;">WOOD</div>${renderTrimSpecPageTable(sp, idx+1, trimPages[idx], true)}` : ''}
      <div class="spec-diagram" style="display:flex; gap:16px; align-items:flex-start;">
        <img src="data:image/png;base64,${OPENING_DIAGRAM_B64}" alt="Тип відкривання" style="width:260px; display:block;">
        ${trimPages[idx] ? `<img src="data:image/png;base64,${TRIMBOX_DIAGRAM_B64}" alt="Короб, добірна планка, лиштва" style="width:260px; display:block;">` : ''}
      </div>
    </div>`).join('')
    : pageNums.map((pn,idx)=>`
    <div class="spec-sheet">
      <div class="spec-head">
        <table class="spec-headinfo"><tr>
          <td><b>Замовлення</b><br><span class="mono" style="font-size:16px;">${esc(sp.number)}</span></td>
          <td><b>Дата</b><br>${esc(sp.date)}</td>
          <td style="width:40%; text-align:center; font-weight:700; font-size:14px;">Додаток ${idx+1}${pageNums.length>1?' (стор. '+(idx+1)+' з '+pageNums.length+')':''}</td>
          <td style="text-align:right;">Термін дії комерційної пропозиції ${esc(sp.offerValidDays)} дні</td>
        </tr></table>
        <div style="text-align:center; font-size:11px; margin-top:2px;">Термін ${esc(sp.productionDays)} днів</div>
      </div>
      ${sp.kind==='trim' ? renderTrimSpecPageTable(sp, pn, pages[pn]) : sp.kind==='cutting' ? renderCuttingSpecPageTable(sp, pn, pages[pn]) : renderSpecPageTable(sp, pn, pages[pn])}
    </div>`).join('');

  // Розкрій — та сама специфікація по цьому ж замовленню, просто для іншого майстра. Друкується
  // одразу після основних листів, в межах одного й того самого документа/кнопки "Печать".
  const cuttingPages = buildNumberedPages(sp.cuttingEntries||[]);
  const cuttingSheetsHtml = cuttingPages.map((pageEntries,idx)=>`
    <div class="spec-sheet">
      <div class="spec-head">
        <table class="spec-headinfo"><tr>
          <td><b>Замовлення</b><br><span class="mono" style="font-size:16px;">${esc(sp.number)}</span></td>
          <td><b>Дата</b><br>${esc(sp.date)}</td>

        </tr></table>
        <div style="text-align:center; font-size:11px; margin-top:2px;">Термін ${esc(sp.productionDays)} днів</div>

      ${renderCuttingSpecPageTable(sp, idx+1, pageEntries)}
