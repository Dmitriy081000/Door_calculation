  // Спеціфікація для різальника алюмінієвого профілю (скритий монтаж) — той самий принцип,
  // друкується разом з основним документом.
  const aluPages = buildNumberedPages(sp.aluCuttingEntries||[]);
  const aluSheetsHtml = aluPages.map((pageEntries,idx)=>`
    <div class="spec-sheet">
      <div class="spec-head">
        <table class="spec-headinfo"><tr>
          <td><b>Замовлення</b><br><span class="mono" style="font-size:16px;">${esc(sp.number)}</span></td>
          <td><b>Дата</b><br>${esc(sp.date)}</td>
          <td style="width:40%; text-align:center; font-weight:700; font-size:14px;">Різання алюмінієвого профілю${aluPages.length>1?' (стор. '+(idx+1)+' з '+aluPages.length+')':''}</td>
          <td style="text-align:right;">Термін дії комерційної пропозиції ${esc(sp.offerValidDays)} дні</td>
        </tr></table>
        <div style="text-align:center; font-size:11px; margin-top:2px;">Термін ${esc(sp.productionDays)} днів</div>
      </div>
      ${renderAluCuttingSpecPageTable(sp, idx+1, pageEntries)}
    </div>`).join('');

  return `
  <div class="toolbar no-print">
    <button class="btn btn-ghost" id="btnBackSpecs">← До списку специфікацій</button>
    <button class="btn btn-primary" id="btnPrintSpec">Друк / Зберегти PDF</button>
    <button class="btn btn-ghost" id="btnExportSpecXls">Зберегти в Excel</button>
    ${(sp.cuttingEntries || sp.aluCuttingEntries) ? (state.notePickerOpen ? `
    <span style="display:inline-flex; gap:4px; align-items:center;">
      <span style="font-size:12px; color:var(--muted);">Куди додати примітку?</span>
      <button class="btn btn-ghost" id="btnAddNoteToSpec">В специфікацію</button>
      ${sp.cuttingEntries ? `<button class="btn btn-ghost" id="btnAddNoteToCutting">В розкрій</button>` : ''}
      ${sp.aluCuttingEntries ? `<button class="btn btn-ghost" id="btnAddNoteToAlu">В різання профілю</button>` : ''}
      <button class="btn btn-ghost" id="btnCancelNotePicker">Скасувати</button>
    </span>` : `<button class="btn btn-ghost" id="btnAddSpecNote">+ Примітка</button>`)
      : `<button class="btn btn-ghost" id="btnAddSpecNote">+ Примітка</button>`}
    <button class="btn btn-ghost" id="btnAddSpecDoor">+ Порожні двері</button>
  </div>

  <div class="card no-print">
    <div class="card-title">Параметри замовлення</div>
    <div class="row2">
      <div class="field"><label>№ замовлення</label><input id="sp_number" value="${esc(sp.number)}"></div>
      <div class="field"><label>Дата</label><input id="sp_date" value="${esc(sp.date)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Термін дії комерційної пропозиції, днів</label><input type="text" inputmode="numeric" id="sp_validdays" value="${esc(sp.offerValidDays)}"></div>
      <div class="field"><label>Термін виготовлення, днів</label><input type="text" inputmode="numeric" id="sp_proddays" value="${esc(sp.productionDays)}"></div>
    </div>
  </div>

  <div id="specSheet">
    ${sheetsHtml}
    ${cuttingSheetsHtml}
    ${aluSheetsHtml}
  </div>`;
}

/* ============================================================
   HANDLERS
============================================================ */
function attachHandlers(){
  const btnUnlockPrices = document.getElementById('btnUnlockPrices');
  if(btnUnlockPrices){
    const doUnlock = ()=>{
      const inp = document.getElementById('pricesPasswordInput');
      if(inp && inp.value === PRICES_TAB_PASSWORD){ state.pricesUnlocked = true; render(); }
      else { const err = document.getElementById('pricesPasswordError'); if(err) err.style.display='block'; }
    };
    btnUnlockPrices.onclick = doUnlock;
    const pwInput = document.getElementById('pricesPasswordInput');
    if(pwInput) pwInput.onkeydown = (e)=>{ if(e.key==='Enter') doUnlock(); };
  }
  ['hidden','trim'].forEach(kind=>{
    const prefix = kind==='hidden'?'h':'t';
    const f = kind==='hidden'?state.hf:state.tf;

    const elSeries = document.getElementById(prefix+'_series');
    if(elSeries) elSeries.onchange = ()=>{
      f.seriesId = elSeries.value;
      const s = state.series.find(x=>x.id===f.seriesId);
      f.rowId = (kind==='trim' || !s || !s.rows.length) ? '' : s.rows[0].id;
      f.hingeType=''; f.hingeQty=''; f.faceFinish=''; f.backFinish='';
      if(kind==='hidden' && s){ f.opening = s.allowInsideOpening && !s.allowNormalOpening ? 'inside' : (s.allowNormalOpening ? 'normal' : 'inside'); }
      if(kind==='trim' && s && s.allowNormalOpening!=null){ f.opening = s.allowInsideOpening && !s.allowNormalOpening ? 'inside' : (s.allowNormalOpening ? 'self' : 'inside'); }
      render();
    };
    const elRow = document.getElementById(prefix+'_row');
    if(elRow) elRow.onchange = ()=>{ f.rowId=elRow.value; f.hingeType=''; f.hingeQty=''; f.faceFinish=''; f.backFinish=''; render(); };
    if(kind==='trim'){
      document.querySelectorAll('[data-modelgroup]').forEach(b=> b.onclick = ()=>{ f.modelGroup=b.dataset.modelgroup; f.trimModelImageId=''; render(); });
      document.querySelectorAll('[data-pick-model-img]').forEach(el=> el.onclick = ()=>{ f.trimModelImageId=el.dataset.pickModelImg; render(); });
      const elChangeModel = document.querySelector('[data-change-model]');
      if(elChangeModel) elChangeModel.onclick = ()=>{ f.trimModelImageId=''; render(); };
    }
    const elWidth = document.getElementById(prefix+'_width');
    if(elWidth){
      elWidth.oninput = ()=>{ f.width=elWidth.value; _suppressDimBlur=true; render(); setTimeout(()=>{ _suppressDimBlur=false; },0); };
      elWidth.onblur = ()=>{ if(_suppressDimBlur) return; setTimeout(()=>{ const r=roundTo5(f.width); if(r!=null && String(r)!==f.width){ f.width=String(r); render(); } }, 0); };
      elWidth.onkeydown = (e)=>{ if(e.key==='Enter') elWidth.blur(); };
    }
    const elHeight = document.getElementById(prefix+'_height');
    if(elHeight){
      elHeight.oninput = ()=>{ f.height=elHeight.value; _suppressDimBlur=true; render(); setTimeout(()=>{ _suppressDimBlur=false; },0); };
      elHeight.onblur = ()=>{ if(_suppressDimBlur) return; setTimeout(()=>{ const r=roundTo5(f.height); if(r!=null && String(r)!==f.height){ f.height=String(r); render(); } }, 0); };
      elHeight.onkeydown = (e)=>{ if(e.key==='Enter') elHeight.blur(); };
    }
    const elManual = document.getElementById(prefix+'_manualprice');
    if(elManual) elManual.oninput = ()=>{ f.manualPrice=elManual.value; render(); };
    const elHingeType = document.getElementById(prefix+'_hingetype');
    if(elHingeType) elHingeType.onchange = ()=>{ f.hingeType=elHingeType.value; render(); };
    const elHingeQty = document.getElementById(prefix+'_hingeqty');
    if(elHingeQty) elHingeQty.oninput = ()=>{ f.hingeQty=elHingeQty.value; render(); };
    const elQty = document.getElementById(prefix+'_qty');
    if(elQty) elQty.oninput = ()=>{ f.qty=elQty.value; render(); };

    const elSwapFinish = document.getElementById(prefix+'_swapfinish');
    if(elSwapFinish) elSwapFinish.onclick = ()=>{ const t=f.faceFinish; f.faceFinish=f.backFinish; f.backFinish=t; render(); };
    const elFaceFinish = document.getElementById(prefix+'_facefinish');
    if(elFaceFinish) elFaceFinish.oninput = ()=>{
      f.faceFinish=elFaceFinish.value;
      const s = state.series.find(x=>x.id===f.seriesId);
      const r = s && s.rows.find(x=>x.id===f.rowId);
      const combo = r && r.finishLabel.split('/').map(p=>p.trim()).filter(Boolean).length===2;
      if(s && !s.allowAsymFinish && !combo) f.backFinish=elFaceFinish.value;
    };
    const elBackFinish = document.getElementById(prefix+'_backfinish');
    if(elBackFinish) elBackFinish.oninput = ()=>{ f.backFinish=elBackFinish.value; };
    if(kind==='hidden'){
      const elLockType = document.getElementById(prefix+'_locktype');
      if(elLockType) elLockType.onchange = ()=>{ f.lockType=elLockType.value; render(); };
      const elLockCustom = document.getElementById(prefix+'_lockCustomText');
      if(elLockCustom) elLockCustom.oninput = ()=>{ f.lockCustomText=elLockCustom.value; render(); };
      const elHandleModel = document.getElementById(prefix+'_handlemodel');
      if(elHandleModel) elHandleModel.onchange = ()=>{ f.handleModel=elHandleModel.value; render(); };
      ['profileColor','hingeColor','lockColor','sealColor','handleColor'].forEach(key=>{
        const sel = document.getElementById(prefix+'_'+key);
        if(sel) sel.onchange = ()=>{ f[key]=sel.value; render(); };
        const cus = document.getElementById(prefix+'_'+key+'Custom');
        if(cus) cus.oninput = ()=>{ f[key+'Custom']=cus.value; render(); };
      });
    }
  });

  document.querySelectorAll('[data-hopening]').forEach(b=> b.onclick = ()=>{ if(b.disabled) return; state.hf.opening=b.dataset.hopening; render(); });
  document.querySelectorAll('[data-hside]').forEach(b=> b.onclick = ()=>{ state.hf.openingSide=b.dataset.hside; render(); });
  document.querySelectorAll('[data-opening]').forEach(b=> b.onclick = ()=>{ if(b.disabled) return; state.tf.opening=b.dataset.opening; render(); });
  document.querySelectorAll('[data-tside]').forEach(b=> b.onclick = ()=>{ state.tf.openingSide=b.dataset.tside; render(); });
  const elOpeningDepth = document.getElementById('t_openingdepth');
  if(elOpeningDepth) elOpeningDepth.oninput = ()=>{
    state.tf.openingDepth = elOpeningDepth.value;
    const d = parseFloat(elOpeningDepth.value);
    state.tf.trimPlankWidth = isFinite(d) ? String(Math.max(0, d-63)) : '';
    render();
  };
  const elTrimPlank = document.getElementById('t_trimplank');
  if(elTrimPlank) elTrimPlank.oninput = ()=>{ state.tf.trimPlankWidth = elTrimPlank.value; };
  const elDoorColorRal = document.getElementById('t_doorcolorral');
  if(elDoorColorRal) elDoorColorRal.oninput = ()=>{ state.tf.doorColorRal = elDoorColorRal.value; render(); };
  document.querySelectorAll('[data-lyshtva]').forEach(b=> b.onclick = ()=>{ state.tf.lyshtvaSets=b.dataset.lyshtva; render(); });
  document.querySelectorAll('[data-alum-insert]').forEach(b=> b.onclick = ()=>{ state.tf.alumInsert=b.dataset.alumInsert; if(b.dataset.alumInsert==='так') state.tf.glassInsertA='ні'; render(); });
  document.querySelectorAll('[data-glass-insert-a]').forEach(b=> b.onclick = ()=>{ state.tf.glassInsertA=b.dataset.glassInsertA; if(b.dataset.glassInsertA==='так') state.tf.alumInsert='ні'; render(); });
  document.querySelectorAll('[data-wooddim]').forEach(inp=> inp.oninput = ()=>{
    const scheme = inp.dataset.woodscheme, key = inp.dataset.wooddim;
    if(!state.tf.woodSchemeDims[scheme]) state.tf.woodSchemeDims[scheme] = {};
    state.tf.woodSchemeDims[scheme][key] = inp.value;
    render();
  });
  ['sealColor','lockColor','hingeColor','handleColor','profileColor','insertColor','glassColor'].forEach(key=>{
    const sel = document.getElementById('t_'+key);
    if(sel) sel.onchange = ()=>{ state.tf[key]=sel.value; render(); };
    const cus = document.getElementById('t_'+key+'Custom');
    if(cus) cus.oninput = ()=>{ state.tf[key+'Custom']=cus.value; };
  });

  document.querySelectorAll('[data-extra]').forEach(chk=> chk.onchange = ()=>{
    const kind = chk.closest('#app').querySelector('[data-add-item]')?.dataset.addItem;
    const f = kind==='trim' ? state.tf : state.hf;
    const id = chk.dataset.extra; const set = new Set(f.extraIds||[]);
    if(chk.checked) set.add(id); else set.delete(id);
    f.extraIds = [...set]; render();
  });
  document.querySelectorAll('[data-extraqty]').forEach(inp=> inp.oninput = ()=>{
    const kind = document.querySelector('[data-add-item]')?.dataset.addItem;
    const f = kind==='trim' ? state.tf : state.hf;
    if(!f.extraQty) f.extraQty = {};
    f.extraQty[inp.dataset.extraqty] = inp.value; render();
  });

  document.querySelectorAll('[data-add-item]').forEach(btn=> btn.onclick = async ()=>{
    const kind = btn.dataset.addItem;
    const f = kind==='trim' ? state.tf : state.hf;
    const calc = computeSeriesCalc(f, kind);
    if(!calc || calc.incomplete) return;
    const item = { uid:uid(), type:kind, mount:kind, title:calc.series.name,
      w:calc.w, h:calc.h, qty:parseInt(f.qty)||1, unit:calc.unit, details:buildDetails(calc, kind, f) };
    if(kind==='hidden'){
      item.spec = {
        profileName: calc.series.name,
        frameMatrix: calc.series.frameMatrix||'',
        finishLabel: (f.faceFinish && f.backFinish) ? (f.faceFinish===f.backFinish ? f.faceFinish : f.faceFinish+' / '+f.backFinish) : calc.row.finishLabel,
        faceFinish: f.faceFinish, backFinish: f.backFinish,
        profileColor: colorValue(f.profileColor,f.profileColorCustom),
        opening: f.opening, openingSide: f.openingSide,
        hingeName: hingeName(calc.hingeType), hingeCode: calc.hingeType, hingeQty: calc.hingeQty,
        hingeColor: colorValue(f.hingeColor,f.hingeColorCustom),
        lockType: f.lockType, lockCustomText: f.lockCustomText,
        lockColor: colorValue(f.lockColor,f.lockColorCustom),
        sealColor: colorValue(f.sealColor,f.sealColorCustom),
        handleModel: f.handleModel, handleColor: colorValue(f.handleColor,f.handleColorCustom),
        widthSurchargeAmount: calc.widthSurchargeAmount||0,
        widthSurchargePercent: calc.extraWidthPercent||0,
        widthSurchargeBase: (calc.series && calc.series.widthSurcharge) ? calc.series.widthSurcharge.baseWidth : 0,
        widthSurchargeSteps: calc.widthSurchargeSteps||0,
        selectedExtras: (calc.extras||[]).map(e=>({name:e.name, qty:e.qty||0, amount:e.computed||0}))
      };
    } else if(kind==='trim'){
      item.spec = {
        modelName: calc.series.name,
        frameMatrix: calc.series.frameMatrix||'',
        finishLabel: calc.row.finishLabel,
        profileThickness: calc.series.name,
        opening: f.opening,
        openingSide: f.openingSide,
        openingDepth: f.openingDepth||'',
        trimPlankWidth: f.trimPlankWidth||'',
        dobirnaPlankaAmount: calc.dobirnaPlankaAmount||0,
        dobirnaPlankaThreshold: calc.dobirnaPlankaThreshold||0,
        widthSurchargeAmount: calc.widthSurchargeAmount||0,
        widthSurchargePercent: calc.extraWidthPercent||0,
        widthSurchargeBase: (calc.series && calc.series.widthSurcharge) ? calc.series.widthSurcharge.baseWidth : 0,
        widthSurchargeSteps: calc.widthSurchargeSteps||0,
        selectedExtras: (calc.extras||[]).map(e=>({name:e.name, qty:e.qty||0, amount:e.computed||0})),
        lyshtvaSets: f.lyshtvaSets||'2',
        doorColorRal: f.doorColorRal||'',
        sealColor: colorValue(f.sealColor,f.sealColorCustom),
        lockColor: colorValue(f.lockColor,f.lockColorCustom),
        hingeColor: colorValue(f.hingeColor,f.hingeColorCustom),
        handleColor: colorValue(f.handleColor,f.handleColorCustom),
        profileColor: /^alum/i.test(calc.series.name) ? colorValue(f.profileColor,f.profileColorCustom) : '',
        alumFrameAmount: calc.alumFrameAmount||0,
        trimModelLabel: (getTrimModelCatalog().find(r=>r.id===f.trimModelImageId)||{}).finishLabel || '',
        alumInsert: (calc.row && calc.row.modelGroup==='a' && f.alumInsert==='так') ? colorValue(f.insertColor,f.insertColorCustom) : '',
        glassInsertA: (calc.row && calc.row.modelGroup==='a' && f.glassInsertA==='так') ? colorValue(f.glassColor,f.glassColorCustom) : '',
        glassColor: (calc.row && calc.row.modelGroup==='b') ? colorValue(f.glassColor,f.glassColorCustom) : '',
        woodSchemeKey: calc.row ? (calc.row.schemeKey||'') : '',
        woodSchemeDims: (calc.row && calc.row.schemeKey && f.woodSchemeDims[calc.row.schemeKey]) ? {...f.woodSchemeDims[calc.row.schemeKey]} : null,
        hingeName: hingeName(calc.hingeType), hingeCode: calc.hingeType, hingeQty: calc.hingeQty
      };
    }
    state.currentObject.items = [...(state.currentObject.items||[]), item];
    await storeSet(KEYS.currentObject, state.currentObject);
    state.tab='object'; render();
  });

  // ---- OBJECT ----
  const oc = document.getElementById('o_client'); if(oc) oc.oninput = async ()=>{ state.currentObject.client=oc.value; await storeSet(KEYS.currentObject, state.currentObject); };
  const oo = document.getElementById('o_object'); if(oo) oo.oninput = async ()=>{ state.currentObject.object=oo.value; await storeSet(KEYS.currentObject, state.currentObject); };
  document.querySelectorAll('[data-remove-item]').forEach(b=> b.onclick = async ()=>{
    state.currentObject.items = state.currentObject.items.filter(i=>i.uid!==b.dataset.removeItem);
    await storeSet(KEYS.currentObject, state.currentObject); render();
  });
  const btnClear = document.getElementById('btnClearObject');
  if(btnClear) btnClear.onclick = async ()=>{
    if(!confirm('Очистити список дверей поточного об\'єкта?')) return;
    state.currentObject.items = []; await storeSet(KEYS.currentObject, state.currentObject); render();
  };
  const btnInv = document.getElementById('btnMakeInvoice');
  if(btnInv) btnInv.onclick = async ()=>{
    const o = state.currentObject;
    const total = o.items.reduce((s,i)=>s+i.unit*i.qty,0);
    const number = String(state.invoices.length+1).padStart(3,'0')+'-'+new Date().getFullYear();
    const inv = { id:uid(), number, createdAt:Date.now(), date:new Date().toLocaleDateString('ru-RU'), client:o.client, object:o.object, items:o.items, total };
    state.invoices = [...state.invoices, inv];
    await storeSet(KEYS.invoices, state.invoices);
    state.currentObject = {client:'', object:'', items:[]};
    await storeSet(KEYS.currentObject, state.currentObject);
    state.tab='invoices'; state.viewInvoiceId=inv.id; render();
  };

  // ---- PRICES: hingeRef + extras catalogs ----
  document.querySelectorAll('tr[data-row]').forEach(tr=>{
    const cat = tr.dataset.row, id = tr.dataset.id, key = cat;
    tr.querySelectorAll('[data-f]').forEach(input=>{
      input.onchange = async ()=>{
        const item = state[key].find(x=>x.id===id); if(!item) return;
        const f = input.dataset.f;
        const numeric = ['price','maxWeightPair'];
        item[f] = numeric.includes(f) ? (parseFloat(input.value)||0) : input.value;
        await storeSet(KEYS[key], state[key]);
        if(cat==='hingeRef') render();
      };
    });
  });
  document.querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{
    const key = b.dataset.del;
    state[key] = state[key].filter(x=>x.id!==b.dataset.id);
    await storeSet(KEYS[key], state[key]); render();
  });
  document.querySelectorAll('[data-add]').forEach(b=> b.onclick = async ()=>{
    const cat = b.dataset.add;
    if(cat==='hingeRef'){
      state.hingeRef.push({id:uid(), code:'X'+(state.hingeRef.length+1), name:'Новий тип завіси', maxWeightPair:0});
      await storeSet(KEYS.hingeRef, state.hingeRef);
    } else {
      state[cat].push({id:uid(), name:'Новая опция', price:0, unit:'fixed'});
      await storeSet(KEYS[cat], state[cat]);
    }
    render();
  });

  // ---- SERIES editor ----
  document.querySelectorAll('[data-series-field]').forEach(inp=> inp.onchange = async ()=>{
    const s = state.series.find(x=>x.id===inp.dataset.seriesId); if(!s) return;
    s[inp.dataset.seriesField] = inp.value;
    await storeSet(KEYS.series, state.series);
    if(inp.dataset.seriesField==='kind') render();
  });
  document.querySelectorAll('[data-ws-field]').forEach(inp=> {
    const handler = async ()=>{
      const s = state.series.find(x=>x.id===inp.dataset.seriesId); if(!s) return;
      if(!s.widthSurcharge) s.widthSurcharge = {enabled:false, baseWidth:815, step:100, percent:15, maxWidth:1100};
      const f = inp.dataset.wsField;
      s.widthSurcharge[f] = (f==='enabled') ? inp.checked : (parseFloat(inp.value)||0);
      await storeSet(KEYS.series, state.series); render();
    };
    inp.onchange = handler;
  });
  document.querySelectorAll('[data-tier-field]').forEach(inp=> inp.onchange = async ()=>{
    const s = state.series.find(x=>x.id===inp.dataset.seriesId); if(!s) return;
    const t = s.tiers.find(x=>x.id===inp.dataset.tierId); if(!t) return;
    const f = inp.dataset.tierField;
    t[f] = (f==='label') ? inp.value : (parseFloat(inp.value)||0);
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-add-tier]').forEach(b=> b.onclick = async ()=>{
    const s = state.series.find(x=>x.id===b.dataset.addTier); if(!s) return;
    s.tiers.push({id:uid(), label:'новая вилка', maxWidth:800, maxHeight:2100});
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-del-tier]').forEach(b=> b.onclick = async ()=>{
    const s = state.series.find(x=>x.id===b.dataset.seriesId); if(!s) return;
    s.tiers = s.tiers.filter(t=>t.id!==b.dataset.delTier);
    s.rows.forEach(r=> delete r.cells[b.dataset.delTier]);
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-rowfield]').forEach(inp=> inp.onchange = async ()=>{
    const tr = inp.closest('tr'); const s = state.series.find(x=>x.id===tr.dataset.seriesRow); if(!s) return;
    const r = s.rows.find(x=>x.id===tr.dataset.rowId); if(!r) return;
    r.finishLabel = inp.value; await storeSet(KEYS.series, state.series);
  });
  document.querySelectorAll('[data-cellfield]').forEach(inp=>{
    inp.onchange = async ()=>{
      const tr = inp.closest('tr'); const s = state.series.find(x=>x.id===tr.dataset.seriesRow); if(!s) return;
      const r = s.rows.find(x=>x.id===tr.dataset.rowId); if(!r) return;
      const tid = inp.dataset.tierId;
      if(!r.cells[tid]) r.cells[tid] = {price:0, hingeQty:0, hingeType:''};
      const f = inp.dataset.cellfield;
      r.cells[tid][f] = (f==='hingeType') ? inp.value : (parseFloat(inp.value)||0);
      await storeSet(KEYS.series, state.series);
    };
  });
  document.querySelectorAll('[data-add-row]').forEach(b=> b.onclick = async ()=>{
    const s = state.series.find(x=>x.id===b.dataset.addRow); if(!s) return;
    const cells = {}; s.tiers.forEach(t=> cells[t.id]={price:0,hingeQty:0,hingeType:''});
    s.rows.push({id:uid(), finishLabel:'Новая строка', cells});
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-del-row]').forEach(b=> b.onclick = async ()=>{
    const s = state.series.find(x=>x.id===b.dataset.seriesId); if(!s) return;
    s.rows = s.rows.filter(r=>r.id!==b.dataset.delRow);
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-add-series]').forEach(btn=> btn.onclick = async ()=>{
    state.series.push({id:uid(), name:'Новая серия', kind:btn.dataset.addSeries, note:'', widthSurcharge:{enabled:true, baseWidth:815, step:100, percent:15, maxWidth:1100}, tiers:[], rows:[]});
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-del-series]').forEach(b=> b.onclick = async ()=>{
    if(!confirm('Видалити цю серію повністю?')) return;
    state.series = state.series.filter(s=>s.id!==b.dataset.delSeries);
    await storeSet(KEYS.series, state.series); render();
  });
  document.querySelectorAll('[data-export-series]').forEach(b=> b.onclick = ()=> exportSeriesCSV(b.dataset.exportSeries));
  document.querySelectorAll('[data-import-series]').forEach(inp=> inp.onchange = (e)=> importSeriesCSV(inp.dataset.importSeries, e.target.files[0]));

  // ---- COMPANY ----
  const btnSaveCo = document.getElementById('btnSaveCompany');
  if(btnSaveCo) btnSaveCo.onclick = async ()=>{
    const co = state.companies.find(x=>x.id===state.activeCompanyId);
    if(co){
      co.name = document.getElementById('c_name').value;
      co.requisites = document.getElementById('c_requisites').value;
      co.phone = document.getElementById('c_phone').value;
      co.address = document.getElementById('c_address').value;
    }
    await storeSet(KEYS.companies, state.companies); render();
  };
  const btnNewCo = document.getElementById('btnNewCompany');
  if(btnNewCo) btnNewCo.onclick = async ()=>{
    const co = {id:uid(), name:'', requisites:'', phone:'', address:''};
    state.companies = [...state.companies, co];
    state.activeCompanyId = co.id;
    await storeSet(KEYS.companies, state.companies);
    await storeSet(KEYS.activeCompanyId, state.activeCompanyId);
    render();
  };
  document.querySelectorAll('[data-select-company]').forEach(b=> b.onclick = async ()=>{
    state.activeCompanyId = b.dataset.selectCompany;
    await storeSet(KEYS.activeCompanyId, state.activeCompanyId);
    render();
  });
  const btnDelCo = document.getElementById('btnDeleteCompany');
  if(btnDelCo) btnDelCo.onclick = async ()=>{
    if(state.companies.length<=1) return;
    state.companies = state.companies.filter(x=>x.id!==state.activeCompanyId);
    state.activeCompanyId = state.companies[0].id;
    await storeSet(KEYS.companies, state.companies);
    await storeSet(KEYS.activeCompanyId, state.activeCompanyId);
    render();
  };

  // ---- INVOICES ----
  document.querySelectorAll('[data-view-invoice]').forEach(el=> el.onclick = ()=>{ state.viewInvoiceId=el.dataset.viewInvoice; render(); });
  const btnBack = document.getElementById('btnBackInvoices'); if(btnBack) btnBack.onclick = ()=>{ state.viewInvoiceId=null; render(); };
  const btnPrint = document.getElementById('btnPrintInvoice'); if(btnPrint) btnPrint.onclick = ()=> window.print();
  document.querySelectorAll('[data-del-invoice]').forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    if(!confirm('Видалити цей рахунок?')) return;
    state.invoices = state.invoices.filter(i=>i.id!==b.dataset.delInvoice);
    await storeSet(KEYS.invoices, state.invoices); render();
  });

  // ---- SPECIFICATIONS ----
  const btnNewSpec = document.getElementById('btnNewSpec');
  if(btnNewSpec) btnNewSpec.onclick = ()=>{ state.specPicker = true; render(); };
  const btnCancelPicker = document.getElementById('btnCancelPicker');
  if(btnCancelPicker) btnCancelPicker.onclick = ()=>{ state.specPicker = false; render(); };
  document.querySelectorAll('[data-pick-invoice]').forEach(el=> el.onclick = async ()=>{
    const inv = state.invoices.find(i=>i.id===el.dataset.pickInvoice); if(!inv) return;
    const hasHidden = inv.items.some(i=>i.type==='hidden');
    const hasTrim = inv.items.some(i=>i.type==='trim');
    const kind = hasHidden && hasTrim ? 'mixed' : (hasTrim ? 'trim' : 'hidden');
    const sp = {
      id:uid(), number:inv.number, invoiceId:inv.id, createdAt:Date.now(),
      date:new Date().toLocaleDateString('ru-RU'), offerValidDays:2, productionDays:45,
      kind,
      entries: kind==='trim' ? buildTrimSpecFromInvoice(inv) : buildSpecFromInvoice(inv),
      trimEntries: kind==='mixed' ? buildTrimSpecFromInvoice(inv) : undefined,
      // Специфікація для розкрійника — той самий заказ, для іншого майстра. Друкується разом з
      // основною, тому створюється автоматично тут же, а не як окремий документ.
      cuttingEntries: hasTrim ? buildCuttingSpecFromInvoice(inv) : undefined,
      aluCuttingEntries: hasHidden ? buildAluCuttingSpecFromInvoice(inv) : undefined
    };
    state.specifications = [...state.specifications, sp];
    await storeSet(KEYS.specs, state.specifications);
    state.specPicker = false; state.viewSpecId = sp.id; render();
  });
  document.querySelectorAll('[data-view-spec]').forEach(el=> el.onclick = ()=>{ state.viewSpecId = el.dataset.viewSpec; render(); });
  document.querySelectorAll('[data-del-spec]').forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    if(!confirm('Видалити цю специфікацію?')) return;
    state.specifications = state.specifications.filter(s=>s.id!==b.dataset.delSpec);
    await storeSet(KEYS.specs, state.specifications); render();
  });
  const btnBackSpecs = document.getElementById('btnBackSpecs');
  if(btnBackSpecs) btnBackSpecs.onclick = ()=>{ state.viewSpecId=null; state.notePickerOpen=false; render(); };
  const btnPrintSpec = document.getElementById('btnPrintSpec');
  if(btnPrintSpec) btnPrintSpec.onclick = ()=> window.print();
  const btnExportSpecXls = document.getElementById('btnExportSpecXls');
  if(btnExportSpecXls) btnExportSpecXls.onclick = ()=>{
    const sp = state.specifications.find(x=>x.id===state.viewSpecId);
    if(!sp) return;
    if(sp.kind==='trim') exportTrimSpecXls(state.viewSpecId);
    else if(sp.kind==='mixed'){
      exportSpecXls(state.viewSpecId, sp.entries, '-hidden');
      exportTrimSpecXls(state.viewSpecId, sp.trimEntries||[], '-wood');
    } else if(sp.kind==='cutting'){ /* Excel-експорт для розкрою поки не зроблений — тільки PDF/друк */ }
    else exportSpecXls(state.viewSpecId);
  };
  const btnAddSpecNote = document.getElementById('btnAddSpecNote');
  if(btnAddSpecNote) btnAddSpecNote.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    if(sp.cuttingEntries || sp.aluCuttingEntries){ state.notePickerOpen = true; render(); return; }
    sp.entries.push({id:uid(), type:'note', text:''});
    await storeSet(KEYS.specs, state.specifications); render();
  };
  const btnCancelNotePicker = document.getElementById('btnCancelNotePicker');
  if(btnCancelNotePicker) btnCancelNotePicker.onclick = ()=>{ state.notePickerOpen = false; render(); };
  const btnAddNoteToSpec = document.getElementById('btnAddNoteToSpec');
  if(btnAddNoteToSpec) btnAddNoteToSpec.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    sp.entries.push({id:uid(), type:'note', text:''});
    state.notePickerOpen = false;
    await storeSet(KEYS.specs, state.specifications); render();
  };
  const btnAddNoteToCutting = document.getElementById('btnAddNoteToCutting');
  if(btnAddNoteToCutting) btnAddNoteToCutting.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    sp.cuttingEntries = sp.cuttingEntries || [];
    sp.cuttingEntries.push({id:uid(), type:'note', text:''});
    state.notePickerOpen = false;
    await storeSet(KEYS.specs, state.specifications); render();
  };
  const btnAddNoteToAlu = document.getElementById('btnAddNoteToAlu');
  if(btnAddNoteToAlu) btnAddNoteToAlu.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    sp.aluCuttingEntries = sp.aluCuttingEntries || [];
    sp.aluCuttingEntries.push({id:uid(), type:'note', text:''});
    state.notePickerOpen = false;
    await storeSet(KEYS.specs, state.specifications); render();
  };
  const btnAddSpecDoor = document.getElementById('btnAddSpecDoor');
  if(btnAddSpecDoor) btnAddSpecDoor.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    sp.entries.push(sp.kind==='trim' ? blankTrimDoorEntry() : sp.kind==='cutting' ? blankCuttingDoorEntry() : blankDoorEntry());
    await storeSet(KEYS.specs, state.specifications); render();
  };
  ['sp_number','sp_date','sp_validdays','sp_proddays'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = async ()=>{
      const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
      if(id==='sp_number') sp.number=el.value;
      else if(id==='sp_date') sp.date=el.value;
      else if(id==='sp_validdays') sp.offerValidDays=el.value;
      else if(id==='sp_proddays') sp.productionDays=el.value;
      await storeSet(KEYS.specs, state.specifications);
    };
  });
  document.querySelectorAll('[data-specfield]').forEach(inp=>{
    const commit = async ()=>{
      const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
      const arr = sp.entries.find(x=>x.id===inp.dataset.entryId) ? sp.entries : (sp.trimEntries||[]);
      const en = arr.find(x=>x.id===inp.dataset.entryId); if(!en) return;
      const f = inp.dataset.specfield;
      if(f==='blockH' || f==='blockW'){
        const bh = f==='blockH'?inp.value:(en.blockSize||'').split(/[x×]/i)[0]||'';
        const bw = f==='blockW'?inp.value:(en.blockSize||'').split(/[x×]/i)[1]||'';
        en.blockSize = (bh||'')+'×'+(bw||'');
      } else if(f==='panelH' || f==='panelW'){
        const ph = f==='panelH'?inp.value:(en.panelSize||'').split(/[x×]/i)[0]||'';
        const pw = f==='panelW'?inp.value:(en.panelSize||'').split(/[x×]/i)[1]||'';
        en.panelSize = (ph||'')+'×'+(pw||'');
      } else {
        en[f] = inp.value;
      }
      await storeSet(KEYS.specs, state.specifications);
    };
    if(inp.tagName==='TEXTAREA'){
      // Keep typing smooth (no full re-render on every keystroke): live DOM value is what actually
      // gets printed anyway, we just grow the box as they type and persist the value on blur/change.
      inp.oninput = ()=>{ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; };
      inp.onchange = commit;
      inp.style.height = 'auto'; inp.style.height = inp.scrollHeight+'px';
    } else {
      // <select> (Так/Ні, WC/PZ/Ні): update the printable text mirror immediately, this is an
      // infrequent discrete choice so a full re-render on change is fine (no focus/typing to preserve).
      inp.onchange = async ()=>{ await commit(); render(); };
    }
  });
  document.querySelectorAll('[data-move-entry]').forEach(b=> b.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    const inHidden = sp.entries.some(x=>x.id===b.dataset.moveEntry);
    const arrName = inHidden ? 'entries' : 'trimEntries';
    const arr = sp[arrName]||[];
    const idx = arr.findIndex(x=>x.id===b.dataset.moveEntry); if(idx<0) return;
    const dir = b.dataset.dir==='up' ? -1 : 1;
    const swapIdx = idx+dir;
    if(swapIdx<0 || swapIdx>=arr.length) return;
    [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
    sp[arrName] = arr;
    await storeSet(KEYS.specs, state.specifications); render();
  });
  document.querySelectorAll('[data-del-entry]').forEach(b=> b.onclick = async ()=>{
    const sp = state.specifications.find(s=>s.id===state.viewSpecId); if(!sp) return;
    if(!confirm('Видалити цей рядок зі специфікації?')) return;
    const inHidden = sp.entries.some(x=>x.id===b.dataset.delEntry);
    if(inHidden) sp.entries = sp.entries.filter(x=>x.id!==b.dataset.delEntry);
    else sp.trimEntries = (sp.trimEntries||[]).filter(x=>x.id!==b.dataset.delEntry);
    await storeSet(KEYS.specs, state.specifications); render();
  });
}

function download(filename, text){
  const blob = new Blob(["\uFEFF"+text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function downloadHtmlAsXls(filename, htmlTable){
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml>
<x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>Специфікація</x:Name>
<x:WorksheetOptions>
<x:PageSetup><x:Layout x:Orientation="Landscape"/><x:Header x:Margin="0"/><x:Footer x:Margin="0"/><x:PageMargins x:Bottom="0.3" x:Left="0.3" x:Right="0.3" x:Top="0.3"/></x:PageSetup>
<x:Print><x:ValidPrinterInfo/><x:Scale>100</x:Scale></x:Print>
<x:Selected/><x:DoNotDisplayGridlines/>
</x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook>
</xml><![endif]-->
</head><body>${htmlTable}</body></html>`;
  const blob = new Blob([html], {type:'application/vnd.ms-excel;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function exportSpecXls(specId, entriesOverride, filenameSuffix){
  const sp = state.specifications.find(x=>x.id===specId); if(!sp) return;
  const F = 'font-family:Arial,sans-serif;';
  const CTR = 'text-align:center;'; // used only for the data table, not the order-info header block
  const FS = 'font-size:20pt;';
  const WRAP = 'mso-wrap-text:wrap; white-space:normal; vertical-align:middle;';
  const PAGE_SIZE = 13; // скільки дверей друкувати на одному аркуші
  const allEntries = entriesOverride||sp.entries;
  // Кожна "сторінка" — окрема повна таблиця (із заголовком і шапкою колонок), розділені явним
  // розривом сторінки: примусовий page-break всередині однієї суцільної таблиці Excel ігнорує.
  const pages = [];
  for(let i=0;i<allEntries.length;i+=PAGE_SIZE) pages.push(allEntries.slice(i,i+PAGE_SIZE));
  if(!pages.length) pages.push([]);

  const colWidths = [40,200,70,70,70,70,240,110,110,110,50,170,80,80,170,100,100,100,40];
  const colgroup = `<colgroup>${colWidths.map(w=>`<col width="${w}" style="width:${w}px;">`).join('')}</colgroup>`;

  let n=0;
  const buildRows = (pageEntries)=> pageEntries.map(e=>{
    n++;
    if(e.type==='note'){ return `<tr><td style="${F} ${FS} ${CTR} font-weight:bold;">${n}</td><td colspan="17" style="font-weight:bold; ${F} ${FS} ${CTR} ${WRAP}">${esc(e.text||'')}</td><td style="${F} ${FS} ${CTR} font-weight:bold;">${n}</td></tr>`; }
    const [bh,bw]=(e.blockSize||'').split(/[x×]/i); const [ph,pw]=(e.panelSize||'').split(/[x×]/i);
    const vals = [e.name,bh,bw,ph,pw,e.finish,e.profileColor,e.opening,e.hinge,e.hingeQty,e.boxType,e.handle,e.wc,e.lockMech,e.lockColor,e.sealColor,e.hingeColor];
    const dimCols = new Set([1,2,3,4]); // bh,bw,ph,pw share one fixed width so all four line up identically
    const cells = vals.map((v,i)=>`<td style="${WRAP} ${FS}${dimCols.has(i)?' width:70px;':''}">${esc(v).replace(/\n/g,'<br>')}</td>`).join('');
    return `<tr style="font-weight:bold; ${F} ${FS} ${CTR}"><td style="${FS}">${n}</td>${cells}<td style="${FS}">${n}</td></tr>`;
  }).join('');

  const buildPage = (pageEntries, isLastPage)=> `
    <table style="${F} border-collapse:collapse; margin-bottom:10px;"><tr>
      <td style="font-weight:bold; font-size:18pt; padding:3px 10px;">Замовлення</td>
      <td style="font-weight:bold; font-size:26pt; padding:3px 10px;">${esc(sp.number)}</td>
      <td style="font-weight:bold; font-size:18pt; padding:3px 10px;">Дата</td>
      <td style="font-size:18pt; padding:3px 10px;">${esc(sp.date)}</td>
      <td style="font-weight:bold; font-size:22pt; text-align:center; padding:3px 20px;">Додаток 1.</td>
      <td style="font-size:18pt; text-align:right; padding:3px 10px;">Термін дії комерційної пропозиції ${esc(sp.offerValidDays)} дні</td>
    </tr><tr>
      <td style="font-weight:bold; font-size:18pt; padding:3px 10px;">Термін</td>
      <td colspan="5" style="font-size:18pt; padding:3px 10px;">${esc(sp.productionDays)} днів</td>
    </tr></table>
    <table border="1" style="${F} ${FS} ${CTR} border-collapse:collapse;">
    ${colgroup}
    <tr>
      <th rowspan="2" style="${FS} width:${colWidths[0]}px;"></th>
      <th rowspan="2" style="${WRAP} ${FS} width:${colWidths[1]}px;">Найменування виробу</th>
      <th colspan="2" style="${FS} width:${colWidths[2]+colWidths[3]}px;">Розмір дверного блоку</th>
      <th colspan="2" style="${FS} width:${colWidths[4]+colWidths[5]}px;">Розмір полотна</th>
      <th rowspan="2" style="${WRAP} ${FS} width:${colWidths[6]}px;">Оздоблення</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[7]}px;">Профіль</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[8]}px;">Відкривання</th>
      <th rowspan="2" style="${WRAP} ${FS} width:${colWidths[9]}px;">Завіси</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[10]}px;">К-сть завіс</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[11]}px;">Тип короби</th>
      <th rowspan="2" style="${WRAP} ${FS} width:${colWidths[12]}px;">Врізання ручки</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[13]}px;">WC/PZ</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[14]}px;">Механізм замку</th>
      <th rowspan="2" style="${WRAP} ${FS} width:${colWidths[15]}px;">Колір механізму</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[16]}px;">Колір ущільнювача</th><th rowspan="2" style="${WRAP} ${FS} width:${colWidths[17]}px;">Колір завіс</th>
      <th rowspan="2" style="${FS} width:${colWidths[18]}px;">№ п/п</th>
    </tr>
    <tr><th style="${FS} width:${colWidths[2]}px;">В</th><th style="${FS} width:${colWidths[3]}px;">Ш</th><th style="${FS} width:${colWidths[4]}px;">В</th><th style="${FS} width:${colWidths[5]}px;">Ш</th></tr>
    ${buildRows(pageEntries)}
    </table>
    ${isLastPage ? `<table style="${F} margin-top:8px;"><tr><td style="font-size:10pt; color:#666;">Схема типів відкривання дверей — див. PDF-версію специфікації.</td></tr></table>` : ''}`;

  const pageBreakDiv = '<div style="page-break-before:always; mso-page-break-before:always; mso-special-character:page-break;"></div>';
  const allPages = pages.map((pageEntries,i)=> (i>0 ? pageBreakDiv : '') + buildPage(pageEntries, i===pages.length-1)).join('');

  downloadHtmlAsXls('specification-'+(sp.number||'').replace(/[^a-zA-Z0-9-]+/g,'-')+(filenameSuffix||'')+'.xls', allPages);
}
function exportTrimSpecXls(specId, entriesOverride, filenameSuffix){
  const sp = state.specifications.find(x=>x.id===specId); if(!sp) return;
  const F = 'font-family:Arial,sans-serif;';
  const CTR = 'text-align:center;';
  const FS = 'font-size:16pt;'; // дані — 16px
  const HFS = 'font-size:12pt;'; // шапка таблиці й верхній блок «Замовлення/Дата» — 12pt
  const WRAP = 'mso-wrap-text:wrap; white-space:normal; vertical-align:middle;';
  const PAGE_SIZE = 13; // скільки дверей друкувати на одному аркуші
  const allEntries = entriesOverride||sp.entries;
  // Розбиваємо на окремі повноцінні таблиці по 13 дверей — примусовий page-break всередині
  // однієї суцільної таблиці Excel ігнорує при такому способі експорту, тому кожна "сторінка"
  // тепер — окрема <table> зі своєю шапкою, розділені явним розривом сторінки між ними.
  const pages = [];
  for(let i=0;i<allEntries.length;i+=PAGE_SIZE) pages.push(allEntries.slice(i,i+PAGE_SIZE));
  if(!pages.length) pages.push([]);

  const colWidths = [40,150,70,70,70,70,110,80,140,180,110,110,50,80,80,170,100,100,100,90,40];
  const colgroup = `<colgroup>${colWidths.map(w=>`<col width="${w}" style="width:${w}px;">`).join('')}</colgroup>`;

  let n=0;
  const buildRows = (pageEntries)=> pageEntries.map(e=>{
    n++;
    if(e.type==='note'){ return `<tr><td style="${F} ${FS} ${CTR} font-weight:bold;">${n}</td><td colspan="19" style="font-weight:bold; ${F} ${FS} ${CTR} ${WRAP}">${esc(e.text||'')}</td><td style="${F} ${FS} ${CTR} font-weight:bold;">${n}</td></tr>`; }
    const [bh,bw]=(e.blockSize||'').split(/[x×]/i); const [ph,pw]=(e.panelSize||'').split(/[x×]/i);
    const [modelLine, collectionLine] = (e.name||'').split('\n'); // "WOOD 02" на верхньому рядку, колекція ("40"/"50") — на нижньому, як у вашому зразку
    const restVals = [bh,bw,ph,pw,e.dobirnaPlanka,e.lyshtva,e.finish,e.decor,e.opening,e.hinge,e.hingeQty,e.handle,e.wc,e.lockMech,e.lockColor,e.sealColor,e.hingeColor,e.profileColor];
    const dimCols = new Set([0,1,2,3]);
    const decorIdx = 7;
    const restCells = restVals.map((v,i)=>`<td rowspan="2" style="${WRAP} ${FS}${dimCols.has(i)?' width:70px;':''}">${i===decorIdx ? esc(v).split(' ').join('<br>') : esc(v).replace(/\n/g,'<br>')}</td>`).join('');
    return `<tr style="font-weight:bold; ${F} ${FS} ${CTR}"><td rowspan="2" style="${FS}">${n}</td><td style="${WRAP} ${FS}">${esc(modelLine||'')}</td>${restCells}<td rowspan="2" style="${FS}">${n}</td></tr>
    <tr style="font-weight:bold; ${F} ${FS} ${CTR}"><td style="${WRAP} ${FS}">${esc(collectionLine||'')}</td></tr>`;
  }).join('');

  const buildTable = (pageEntries, isLastPage)=> `<table border="1" style="${F} ${FS} ${CTR} border-collapse:collapse;">
    ${colgroup}
    <tr style="${F} font-weight:bold; ${HFS}">
      <td colspan="2" style="border:none; text-align:left;">Замовлення</td>
      <td colspan="2" style="border:none;"></td>
      <td style="border:none; text-align:left;">Дата</td>
      <td colspan="2" style="border:none;">${esc(sp.date)}</td>
      <td colspan="9" style="border:none;"></td>
      <td colspan="4" style="border:none; ${HFS} text-align:right;">Термін дії комерційної пропозиції ${esc(sp.offerValidDays)} дні</td>
      <td style="border:none;"></td>
    </tr>
    <tr style="${F} font-weight:bold; ${HFS}">
      <td colspan="2" style="border:none; text-align:left;">${esc(sp.number)}</td>
      <td colspan="6" style="border:none;"></td>
      <td colspan="2" style="border:none; ${HFS} text-align:center;">Додаток 1.</td>
      <td colspan="11" style="border:none;"></td>
    </tr>
    <tr style="${F} ${HFS}">
      <td colspan="8" style="border:none;"></td>
      <td colspan="10" style="border:none; text-align:left; font-weight:bold;">Термін ${esc(sp.productionDays)} днів</td>
      <td colspan="3" style="border:none;"></td>
    </tr>
    <tr><td colspan="21" style="border:none; height:12px; font-size:6pt;">&nbsp;</td></tr>
    <thead>
    <tr style="${HFS}">
      <th rowspan="2" style="${HFS} width:${colWidths[0]}px;"></th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[1]}px;">Найменування виробу</th>
      <th colspan="2" style="${HFS} width:${colWidths[2]+colWidths[3]}px;">Розмір дверного блоку</th>
      <th colspan="2" style="${HFS} width:${colWidths[4]+colWidths[5]}px;">Розмір полотна</th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[6]}px;">Добірна планка</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[7]}px;">Лиштва</th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[8]}px;">Оздоблення</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[9]}px;">Декор</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[10]}px;">Відкривання</th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[11]}px;">Завіси</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[12]}px;">К-сть завіс</th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[13]}px;">Врізання ручки</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[14]}px;">WC/PZ</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[15]}px;">Механізм замку</th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[16]}px;">Колір механізму</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[17]}px;">Колір ущільнювача</th><th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[18]}px;">Колір завіс</th>
      <th rowspan="2" style="${WRAP} ${HFS} width:${colWidths[19]}px;">Колір профілю</th>
      <th rowspan="2" style="${HFS} width:${colWidths[20]}px;">№ п/п</th>
    </tr>
    <tr style="${HFS}"><th style="${HFS} width:${colWidths[2]}px;">В</th><th style="${HFS} width:${colWidths[3]}px;">Ш</th><th style="${HFS} width:${colWidths[4]}px;">В</th><th style="${HFS} width:${colWidths[5]}px;">Ш</th></tr>
    </thead>
    <tbody>
    ${buildRows(pageEntries)}
    ${isLastPage ? `<tr><td colspan="2" style="border:none; text-align:left; font-size:10pt; color:#666; font-weight:normal;">Схема короба / добірної планки / лиштви — див. PDF-версію специфікації.</td><td colspan="18" style="border:none;"></td></tr>` : ''}
    </tbody>
  </table>`;

  const pageBreakDiv = '<div style="page-break-before:always; mso-page-break-before:always; mso-special-character:page-break;"></div>';
  const allTables = pages.map((pageEntries,i)=> (i>0 ? pageBreakDiv : '') + buildTable(pageEntries, i===pages.length-1)).join('');

  downloadHtmlAsXls('specification-'+(sp.number||'').replace(/[^a-zA-Z0-9-]+/g,'-')+(filenameSuffix||'')+'.xls', allTables);
}
function exportSeriesCSV(seriesId){
  const s = state.series.find(x=>x.id===seriesId); if(!s) return;
  const header = ['finishLabel', ...s.tiers.flatMap(t=>['price_'+t.label,'hingeQty_'+t.label,'hingeType_'+t.label])];
  const rows = [header.join(';')];
  s.rows.forEach(r=>{
    const line = [r.finishLabel];
    s.tiers.forEach(t=>{ const c = r.cells[t.id]||{price:0,hingeQty:0,hingeType:''}; line.push(c.price, c.hingeQty, c.hingeType); });
    rows.push(line.join(';'));
  });
  download((s.name||'series').replace(/[^a-zA-Z0-9а-яА-ЯёЁ]+/g,'-')+'.csv', rows.join('\n'));
}
function importSeriesCSV(seriesId, file){
  if(!file) return;
  const s = state.series.find(x=>x.id===seriesId); if(!s) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    const text = reader.result.replace(/^\uFEFF/,'');
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
    lines.shift();
    const newRows = lines.map(l=>{
      const parts = l.split(';');
      const finishLabel = parts[0]||'Без названия';
      const cells = {};
      s.tiers.forEach((t,i)=>{
        const base = 1 + i*3;
        cells[t.id] = { price: parseFloat(parts[base])||0, hingeQty: parseInt(parts[base+1])||0, hingeType: (parts[base+2]||'').trim() };
      });
      return {id:uid(), finishLabel, cells};
    });
    s.rows = newRows;
    await storeSet(KEYS.series, state.series);
    render();
  };
  reader.readAsText(file, 'UTF-8');
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab'); if(!btn) return;
  state.tab = btn.dataset.tab;
  if(state.tab!=='invoices') state.viewInvoiceId = null;
  if(state.tab!=='specs'){ state.viewSpecId = null; state.specPicker = false; state.notePickerOpen = false; }
  window.scrollTo(0, 0); // переключення вкладки — завжди починаємо згори, а не там, де було раніше
  render();
});

// Клік будь-де поза полем "Ширина"/"Висота" — примусово знімаємо з нього фокус, щоб округлення
// до 5мм спрацьовувало навіть при кліку на порожнє місце сторінки, а не лише на інше поле.
document.addEventListener('click', (e)=>{
  const active = document.activeElement;
  if(active && active.id && /_(width|height)$/.test(active.id) && !e.target.closest(`#${active.id}`)){
    active.blur();
  }
});

(async function init(){ await loadAll(); render(); })();
